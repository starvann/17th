<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffefb">
<meta property="og:title" content="You're invited to Aza's Birthday!">
<meta property="og:description" content="Sat, 17 October 2026 · Sweet and Salty, Pekalongan">
<title>Undangan Ulang Tahun Aza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Rubik+Mono+One&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--paper:#fffefb;--ink:#111;--red:#c8302f;--blue:#5b6df0;--orange:#ffb347;--yellow:#f7d51d;--green:#0b8f3a;--sky:#2f6fd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#fffefb;--ink:#111}}
:root[data-theme="dark"]{--paper:#fffefb;--ink:#111}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#e9e6df;color:var(--ink);font-family:'Gochi Hand','Patrick Hand',cursive;display:flex;justify-content:center}
.card{position:relative;width:100%;max-width:480px;min-height:100vh;min-height:100dvh;background:var(--paper);overflow:hidden;padding:40px 22px 0}
.hi{font-family:'Patrick Hand',sans-serif;font-weight:900;font-size:clamp(40px,12vw,58px);text-align:center;display:flex;align-items:baseline;justify-content:center;gap:8px;margin:0}
.hi .nm{font:inherit;font-weight:900;min-width:4ch;max-width:62%;border:0;border-bottom:5px solid var(--ink);background:transparent;color:var(--ink);padding:0;cursor:pointer;border-radius:0;overflow-wrap:anywhere}
.hi .nm:focus-visible,.box input:focus-visible,.box button:focus-visible{outline:3px dashed var(--blue);outline-offset:4px}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.pop[hidden]{display:none}
.box{background:var(--paper);color:var(--ink);width:100%;max-width:360px;padding:28px 22px;border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;text-align:center}
.box p{font-size:32px;margin:0 0 16px;line-height:1.1}
.box input{font:inherit;font-size:30px;width:100%;border:0;border-bottom:4px solid var(--ink);text-align:center;background:transparent;color:var(--ink);padding:4px;border-radius:0}
.box button{font:inherit;font-size:26px;color:var(--ink);margin-top:20px;padding:8px 22px;border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;background:var(--yellow);cursor:pointer}
.sub{text-align:center;font-size:clamp(23px,6.6vw,30px);margin:6px 0 0}
.title{display:flex;justify-content:center;gap:2px;margin:18px 0 0;position:relative;font-family:'Rubik Mono One',sans-serif;font-size:clamp(70px,26vw,130px);line-height:1;letter-spacing:-6px}
.title span{-webkit-text-stroke:3px var(--ink);color:transparent;background:repeating-linear-gradient(115deg,var(--c) 0 5px,color-mix(in srgb,var(--c) 55%,#fff) 5px 8px);-webkit-background-clip:text;background-clip:text;transform:rotate(var(--r))}
.title span:nth-child(1){--c:var(--red);--r:-3deg}.title span:nth-child(2){--c:var(--blue);--r:2deg}.title span:nth-child(3){--c:var(--orange);--r:-1deg}
.title svg{position:absolute;left:0;top:-10px;width:14%;max-width:70px}
.bd{text-align:center;font-size:clamp(26px,8vw,34px);margin:4px 0 0}
.stage{position:relative;aspect-ratio:436/330;margin-top:6px}
.stage svg{position:absolute}
.star{left:-6%;top:14%;width:54%;transform:rotate(-8deg)}
.star text{font-family:'Patrick Hand','Gochi Hand',cursive;font-size:36px;fill:#111;text-anchor:middle;paint-order:stroke;stroke:#111;stroke-width:.8px}
.dino{left:21%;top:0;width:39%}
.duck{left:21%;top:58%;width:25%}
.photo{position:absolute;right:-3%;top:-12%;width:56%;height:auto;z-index:2}
.torn{position:relative;z-index:1;margin:0 -22px;padding:56px 28px 30px;background:#f1efea;clip-path:polygon(0 14px,6% 4px,14% 12px,24% 2px,36% 10px,48% 3px,60% 12px,72% 4px,84% 11px,94% 3px,100% 10px,100% 100%,0 100%);font-size:clamp(25px,7.4vw,34px);line-height:1.15}
.torn p{margin:0}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.btns a{font:inherit;font-size:24px;color:var(--ink);text-decoration:none;padding:8px 18px;border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;background:var(--yellow)}
.btns a:nth-child(2){background:#fff}
.btns a:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
#cd{font-size:24px;margin-top:14px;color:#444}
</style>
</head>

  <h1 class="hi">Hi, <button type="button" id="nama" class="nm" aria-label="Ganti nama"></button>!</h1>
  <p class="sub">You're invited to</p>

  <div class="title" aria-label="Aza">

    <span>A</span><span>Z</span><span>A</span>
